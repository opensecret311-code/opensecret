<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>OPEN SECRET | Product</title><link rel="stylesheet" href="style.css"></head><body>
<header class="header"><a class="logo" href="index.html"><img src="assets/logo.png" alt="OPEN SECRET"></a><nav class="nav"><a href="index.html#home">Home</a><a href="index.html#shop">Shop</a><a href="index.html#about">About</a><a href="index.html#contact">Contact</a></nav><div class="header-actions"><button class="icon-btn" onclick="location.href='index.html#shop'">←</button><button class="icon-btn" onclick="location.href='index.html'">🛒</button></div></header>
<main class="detail"><div class="detail-grid"><div><div class="gallery-main" id="mainImage"></div><div class="thumbs" id="thumbs"></div></div><div><div class="eyebrow">OPEN SECRET</div><h1 id="name"></h1><p class="desc" id="tags"></p><div class="eyebrow" style="margin-top:30px">Choose your size</div><div class="sizes" id="sizes"></div><div class="orderbox"><div class="selected">Selected size<strong id="selected"></strong></div><div class="detail-price" id="price"></div><button class="btn" id="add" style="width:100%">Add to Cart</button></div></div></div></main>
<script>
const PRODUCTS=[{"id": 2, "name": "Creed Aventus", "prices": {"6 ml": 150, "10 ml": 250, "20 ml": 450, "30 ml": 600, "50 ml": "Call/SMS for price"}, "tags": "Fresh \u2022 Fruity \u2022 Powerful", "images": ["assets/product-2-1.jpg", "assets/product-2-2.jpg", "assets/product-2-3.jpg"]}, {"id": 4, "name": "Versace Eros", "prices": {"6 ml": 150, "10 ml": 250, "20 ml": 450, "30 ml": 600, "50 ml": "Call/SMS for price"}, "tags": "Fresh \u2022 Citrus \u2022 Seductive", "images": ["assets/product-4-1.jpg", "assets/product-4-2.jpg", "assets/product-4-3.jpg"]}, {"id": 10, "name": "Dior Sauvage", "prices": {"6 ml": 140, "10 ml": 230, "20 ml": 420, "30 ml": 550, "50 ml": "Call/SMS for price"}, "tags": "Fresh \u2022 Spicy \u2022 Iconic", "images": ["assets/product-10-1.jpg", "assets/product-10-2.jpg", "assets/product-10-3.jpg"]}];
const params=new URLSearchParams(location.search);const p=PRODUCTS.find(x=>String(x.id)===params.get('id'))||PRODUCTS[0];
document.title='OPEN SECRET | '+p.name;document.getElementById('name').textContent=p.name;document.getElementById('tags').textContent=p.tags;
let chosen='6 ml';const main=document.getElementById('mainImage'),thumbs=document.getElementById('thumbs');
function show(src){main.innerHTML=`<img src="${src}" alt="${p.name}">`}
p.images.forEach((src,i)=>{const t=document.createElement('div');t.className='thumb';t.innerHTML=`<img src="${src}" alt="${p.name} photo ${i+1}">`;t.onclick=()=>show(src);thumbs.appendChild(t)});show(p.images[0]);
const sb=document.getElementById('sizes');['6 ml','10 ml','20 ml','30 ml','50 ml'].forEach((s,i)=>{const b=document.createElement('button');b.className='size'+(i===0?' active':'');b.textContent=s;b.onclick=()=>{document.querySelectorAll('.size').forEach(x=>x.classList.remove('active'));b.classList.add('active');chosen=s;update()};sb.appendChild(b)});
function update(){const v=p.prices[chosen];document.getElementById('selected').textContent=chosen;document.getElementById('price').textContent=typeof v==='number'?'৳ '+v:'Call/SMS for price';document.getElementById('add').onclick=()=>add(p.id,chosen)}
function add(id,size){let c=JSON.parse(localStorage.getItem('openSecretCart')||'[]');const pr=PRODUCTS.find(x=>x.id===id);const price=pr.prices[size];const key=id+'-'+size;const f=c.find(x=>x.key===key);if(f)f.qty++;else c.push({key,id,size,price,qty:1});localStorage.setItem('openSecretCart',JSON.stringify(c));location.href='index.html#shop'}
update();
</script></body></html>
